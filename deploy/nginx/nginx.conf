# ==============================================================================
# Nginx Production Configuration for Hospital Clinical Deployment
# Project: Ovarian Ultrasound AI Decision Support System (Human-in-the-Loop)
# Security Standard: FDA 21 CFR Part 11, HIPAA, ISO 27799 / Circular 46/2018/TT-BYT
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --------------------------------------------------------------------------
    # Structured Audit Logging (Clinical Traceability & Diagnostic Latency)
    # --------------------------------------------------------------------------
    log_format clinical_combined '$remote_addr - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" '
                                'rt=$request_time urt=$upstream_response_time '
                                'facility="$http_x_facility_code" '
                                'actor="$http_x_actor_id"';

    access_log /var/log/nginx/ovarian_ai_access.log clinical_combined;
    error_log /var/log/nginx/ovarian_ai_error.log warn;

    # --------------------------------------------------------------------------
    # Performance & Payload Optimization for Medical Imaging (DICOM / Ultrasound)
    # --------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off; # Suppress Nginx version disclosure

    # Maximum client payload 100MB (Supports 512x512 sweeps, multi-frame DICOM, cine clips)
    client_max_body_size 100M;
    client_body_buffer_size 16M;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # --------------------------------------------------------------------------
    # Rate Limiting (Protection against DoS & Credential Stuffing)
    # --------------------------------------------------------------------------
    # General API endpoints: 30 requests/second per client IP
    limit_req_zone $binary_remote_addr zone=clinical_api_limit:20m rate=30r/s;
    # Sensitive Auth endpoints: 5 requests/minute per client IP
    limit_req_zone $binary_remote_addr zone=clinical_auth_limit:10m rate=5r/m;
    limit_req_status 429;

    # --------------------------------------------------------------------------
    # Compression (Gzip for static assets & JSON payloads; bypass compressed images)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Upstream Backend Pool (FastAPI Uvicorn Workers)
    # --------------------------------------------------------------------------
    upstream ovarian_ai_backend {
        server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # HTTP to HTTPS Strict Redirection
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name ovarian-ai.hospital.lan;

        # Redirect all HTTP requests to TLS port 443 with HSTS
        location / {
            return 301 https://$host$request_uri;
        }

        # Let's Encrypt / ACME challenge directory if applicable
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }

    # --------------------------------------------------------------------------
    # HTTPS Production Medical Server
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name ovarian-ai.hospital.lan;

        # SSL/TLS Certificate and Key (Internal Hospital PKI or Public CA)
        ssl_certificate /etc/ssl/certs/ovarian-ai.hospital.lan.crt;
        ssl_certificate_key /etc/ssl/private/ovarian-ai.hospital.lan.key;
        ssl_trusted_certificate /etc/ssl/certs/hospital-root-ca.crt;

        # TLS Protocols & Cipher Suites (Strict Medical-Grade Security)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

        # Session Caching & Tickets
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 10.0.0.2 10.0.0.3 valid=300s;
        resolver_timeout 5s;

        # ----------------------------------------------------------------------
        # Hospital Hardened Security Headers (OPS-04 / OWASP Medical Guideline)
        # ----------------------------------------------------------------------
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self';" always;

        # ----------------------------------------------------------------------
        # Frontend Single Page Application (Static Assets & Canvas UI)
        # ----------------------------------------------------------------------
        root /opt/ovarian-ai/frontend;
        index index.html;

        # Static assets with long-term caching
        location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            try_files $uri =404;
        }

        # HTML entry point - Never cache index.html to allow instant client rollouts
        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri $uri/ /index.html;
        }

        # ----------------------------------------------------------------------
        # Authentication API Endpoints (Strict Rate Limiting)
        # ----------------------------------------------------------------------
        location /api/auth/ {
            limit_req zone=clinical_auth_limit burst=10 nodelay;

            proxy_pass http://ovarian_ai_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Auth timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }

        # ----------------------------------------------------------------------
        # Clinical Backend REST API (General Rate Limiting & Proxying)
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=clinical_api_limit burst=50 nodelay;

            proxy_pass http://ovarian_ai_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Inference & PACS transfer timeouts (Allow 120s for intensive AI deep scans)
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 8 128k;
            proxy_busy_buffers_size 256k;
        }

        # ----------------------------------------------------------------------
        # Real-time WebSocket Notifications & HITL Event Stream
        # ----------------------------------------------------------------------
        location /api/ws/ {
            proxy_pass http://ovarian_ai_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for persistent clinical telemetry & lease sync
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ----------------------------------------------------------------------
        # Health & Readiness Check Probes (Internal Monitoring / Kubernetes / Keepalived)
        # ----------------------------------------------------------------------
        location /health {
            proxy_pass http://ovarian_ai_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # Deny access to hidden files (.git, .env, etc.)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
