version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ovarian-ultrasound-ai:latest
    container_name: ovarian_ai_backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - APP_DB_PATH=/app/data/ovarian_ai.db
      - APP_DATA_DIR=/app/data
      - APP_JWT_SECRET=${APP_JWT_SECRET:?APP_JWT_SECRET must be set in environment}
      - APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD:?APP_ADMIN_PASSWORD must be set in environment}
      - APP_DOCTOR_PASSWORD=${APP_DOCTOR_PASSWORD:?APP_DOCTOR_PASSWORD must be set in environment}
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
      - ./checkpoints:/app/checkpoints:ro
      - ./evaluation:/app/evaluation:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: ovarian_ai_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
